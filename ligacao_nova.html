<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELFSM — Protótipo · Jornada Digital de Ligação Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#1A1F71;
    --azul-2:#2A3199;
    --amarelo:#F7B600;
    --amarelo-escuro:#B98300;
    --branco:#FFFFFF;
    --texto:#151834;
    --texto-suave:#5B5F82;
    --linha:#E3E4F1;
    --fundo-suave:#F5F6FB;
    --verde:#1F8A57;
    --vermelho:#D64545;
    --sombra: 0 1px 2px rgba(21,24,52,.06);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--branco);
    color:var(--texto);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Outfit',system-ui,sans-serif;}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 32px;
    border-bottom:1px solid var(--linha);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;
    background:var(--azul);
    position:relative;
    flex:none;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .brand-mark img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .brand-text{line-height:1.15;}
  .brand-text strong{display:block;font-family:'Outfit';font-size:16px;font-weight:700;color:var(--azul);}
  .brand-text span{display:block;font-size:12.5px;color:var(--texto-suave);}
  .topbar-right{font-size:13px;color:var(--texto-suave);text-align:right;}
  .topbar-right b{color:var(--azul);font-weight:600;}

  /* ---------- layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:250px minmax(320px,380px) 1fr;
    gap:0;
    min-height:calc(100vh - 76px);
  }

  /* --- MODO EMBUTIDO (quando aberto no iframe da Mari) --- */
  html.embedded .layout { display: block; min-height: 100vh; height: 100vh; overflow: hidden; }
  html.embedded .topbar { display: none; }
  html.embedded .rail { display: none; }
  html.embedded .stage { padding: 0; background: var(--branco); height: 100%; display: block; }
  html.embedded .phone { width: 100%; height: 100%; border-radius: 0; box-shadow: none; padding: 0; background: none; }
  html.embedded .phone-screen { border-radius: 0; height: 100%; }


  /* ---------- rail ---------- */
  .rail{
    border-right:1px solid var(--linha);
    padding:24px 14px;
    overflow-y:auto;
  }
  .rail-label{
    font-size:11.5px;color:var(--texto-suave);
    padding:0 10px 10px;
    letter-spacing:.01em;
  }
  .rail-item{
    display:flex;align-items:flex-start;gap:10px;
    width:100%;text-align:left;
    padding:9px 10px;border-radius:10px;
    border:none;background:none;cursor:pointer;
    font-family:'Inter';font-size:13.5px;color:var(--texto);
    margin-bottom:2px;
    transition:background .15s ease;
  }
  .rail-item:hover{background:var(--fundo-suave);}
  .rail-item.active{background:var(--azul);color:#fff;}
  .rail-num{
    flex:none;width:22px;height:22px;border-radius:50%;
    background:var(--fundo-suave);color:var(--texto-suave);
    font-size:11px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    margin-top:1px;
  }
  .rail-item.active .rail-num{background:var(--amarelo);color:var(--azul);}
  .rail-item-text b{display:block;font-weight:600;line-height:1.3;}
  .rail-item-text small{display:block;font-size:11px;opacity:.8;margin-top:1px;}

  /* ---------- phone stage ---------- */
  .stage{
    display:flex;align-items:center;justify-content:center;
    padding:36px 24px;
    background:var(--fundo-suave);
  }
  .phone{
    width:320px;height:660px;
    background:#0d0f24;
    border-radius:42px;
    padding:12px;
    box-shadow:0 20px 45px rgba(21,24,52,.18);
  }
  .phone-screen{
    width:100%;height:100%;
    background:var(--branco);
    border-radius:32px;
    overflow:hidden;
    display:flex;flex-direction:column;
    position:relative;
  }
  .statusbar{
    height:30px;flex:none;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;font-size:11.5px;font-weight:600;color:var(--texto);
  }
  .app-header{
    flex:none;padding:6px 20px 14px;
    border-bottom:1px solid var(--linha);
  }
  .app-header .stepline{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;
  }
  .stepline .back{
    width:26px;height:26px;border-radius:50%;
    background:var(--fundo-suave);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--azul);
  }
  .stepline .count{font-size:11px;color:var(--texto-suave);font-weight:600;}
  .track{height:4px;border-radius:3px;background:var(--linha);overflow:hidden;}
  .track-fill{height:100%;background:var(--amarelo);border-radius:3px;transition:width .5s ease;}
  .app-header h2{margin:12px 0 2px;font-size:18px;line-height:1.3;color:var(--texto);}
  .app-header p{margin:0;font-size:12.5px;color:var(--texto-suave);}

  .app-content{
    flex:1;overflow-y:auto;padding:16px 20px 10px;
  }
  .app-footer{
    flex:none;padding:14px 20px 18px;border-top:1px solid var(--linha);
    background:var(--branco);
  }

  .btn{
    display:flex;align-items:center;justify-content:center;
    width:100%;padding:13px 16px;border-radius:12px;
    font-family:'Inter';font-weight:600;font-size:14px;
    border:none;cursor:pointer;
  }
  .btn-primary{background:var(--azul);color:#fff;}
  .btn-primary:active{background:var(--azul-2);}
  .btn-ghost{background:none;color:var(--azul);font-weight:600;font-size:13px;padding:8px;}

  .card{
    border:1px solid var(--linha);border-radius:12px;
    padding:12px 13px;margin-bottom:9px;
    display:flex;align-items:center;gap:11px;
    cursor:pointer;background:var(--branco);
  }
  .card.selected{border-color:var(--azul);background:#F1F2FC;}
  .card .ico{font-size:19px;flex:none;width:30px;text-align:center;}
  .card .txt b{display:block;font-size:13.5px;font-weight:600;}
  .card .txt small{display:block;font-size:11.5px;color:var(--texto-suave);margin-top:1px;}
  .card .check{
    margin-left:auto;width:18px;height:18px;border-radius:50%;
    border:1.6px solid var(--linha);flex:none;
  }
  .card.selected .check{border-color:var(--azul);background:var(--azul);position:relative;}
  .card.selected .check::after{
    content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;
    border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(40deg);
  }

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--texto-suave);margin-bottom:5px;}
  .field .box{
    border:1px solid var(--linha);border-radius:10px;padding:11px 12px;
    font-size:13.5px;color:var(--texto);background:var(--fundo-suave);
  }
  .field .box.editable{background:var(--branco);}

  .banner{
    border-radius:12px;padding:12px 13px;font-size:12.5px;line-height:1.5;margin-bottom:12px;
  }
  .banner.info{background:#EEF0FC;color:var(--azul);}
  .banner.success{background:#EAF6EF;color:var(--verde);}
  .banner.warn{background:#FFF4E0;color:var(--amarelo-escuro);}
  .banner.alert{background:#FCEAEA;color:var(--vermelho);}
  .banner b{display:block;margin-bottom:2px;font-weight:700;}

  .chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
  .chip{
    border:1px solid var(--linha);border-radius:999px;padding:6px 12px;
    font-size:12px;font-weight:600;color:var(--texto-suave);
  }
  .chip.on{background:var(--amarelo);border-color:var(--amarelo);color:var(--azul);}

  .stat-big{
    text-align:center;padding:18px 10px 14px;
  }
  .stat-big .num{font-family:'Outfit';font-size:38px;font-weight:700;color:var(--azul);}
  .stat-big .unit{font-size:13px;color:var(--texto-suave);}

  .row-list{border:1px solid var(--linha);border-radius:12px;overflow:hidden;margin-bottom:10px;}
  .row-item{
    display:flex;align-items:center;gap:10px;padding:10px 13px;
    border-bottom:1px solid var(--linha);font-size:12.5px;
  }
  .row-item:last-child{border-bottom:none;}
  .row-item .k{color:var(--texto-suave);}
  .row-item .v{margin-left:auto;font-weight:600;text-align:right;}

  .doclist .row-item .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .dot.ok{background:var(--verde);}
  .dot.pending{background:var(--amarelo);}
  .dot.bad{background:var(--vermelho);}

  .frame-photo{
    border:2px dashed var(--azul);border-radius:14px;
    height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:var(--azul);font-size:12px;font-weight:600;margin-bottom:12px;
    background:repeating-linear-gradient(135deg, #F1F2FC 0 10px, #FBFBFE 10px 20px);
  }
  .frame-photo .big{font-size:26px;}

  .signature-pad{
    border:1.6px dashed var(--linha);border-radius:12px;height:70px;
    display:flex;align-items:center;justify-content:center;margin-bottom:12px;
    color:var(--texto-suave);font-size:12px;
  }
  .signature-pad.done{border-style:solid;border-color:var(--verde);color:var(--verde);font-weight:600;background:#EAF6EF;}

  .status-track{list-style:none;margin:0 0 8px;padding:0;}
  .status-track li{
    display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--linha);
  }
  .status-track li:last-child{border-bottom:none;}
  .status-track .em{font-size:16px;}
  .status-track b{display:block;font-size:12.5px;}
  .status-track small{display:block;font-size:11px;color:var(--texto-suave);}
  .status-track li.current b{color:var(--azul);}
  .status-track li.done .em{opacity:.55;}
  .status-track li.todo{opacity:.45;}

  .celebrate{
    text-align:center;padding:26px 8px 8px;
  }
  .celebrate .bolt{font-size:44px;}
  .celebrate h2{margin:8px 0 4px;color:var(--azul);}

  .stepper-qty{display:flex;align-items:center;gap:8px;}
  .stepper-qty button{
    width:24px;height:24px;border-radius:7px;border:1px solid var(--linha);
    background:var(--branco);color:var(--azul);font-weight:700;cursor:pointer;font-size:14px;
    line-height:1;
  }
  .stepper-qty span{font-weight:600;font-size:13px;min-width:14px;text-align:center;}

  /* ---------- spec panel ---------- */
  .spec{
    padding:30px 34px;overflow-y:auto;
  }
  .spec-code{
    display:inline-block;background:var(--azul);color:#fff;font-family:'Outfit';
    font-weight:600;font-size:12.5px;padding:4px 11px;border-radius:7px;margin-bottom:12px;
  }
  .spec h2{font-size:23px;margin:0 0 6px;color:var(--texto);}
  .spec .obj{font-size:14px;color:var(--texto-suave);margin-bottom:20px;max-width:60ch;line-height:1.6;}
  .spec-block{margin-bottom:22px;max-width:62ch;}
  .spec-block h3{
    font-size:12px;color:var(--texto-suave);font-weight:700;margin:0 0 9px;
    padding-bottom:7px;border-bottom:1px solid var(--linha);
  }
  .quote{
    font-family:'Outfit';font-size:16px;color:var(--azul);font-weight:600;
    padding:12px 15px;background:var(--fundo-suave);border-radius:10px;margin:0;
  }
  .rn-list{list-style:none;margin:0;padding:0;}
  .rn-list li{
    font-size:13px;line-height:1.6;padding:7px 0 7px 20px;position:relative;
    border-bottom:1px solid var(--linha);
  }
  .rn-list li:last-child{border-bottom:none;}
  .rn-list li::before{
    content:"";position:absolute;left:0;top:14px;width:7px;height:7px;border-radius:50%;
    background:var(--amarelo);
  }
  .rn-list b{color:var(--azul);font-weight:700;margin-right:5px;}
  .bp{font-size:13px;line-height:1.6;color:var(--texto);}
  .bp .tag{
    display:inline-block;font-size:11px;font-weight:700;color:var(--amarelo-escuro);
    background:#FFF4DA;padding:2px 8px;border-radius:6px;margin-bottom:6px;
  }

  @media (max-width:1080px){
    .layout{grid-template-columns:1fr;}
    .rail{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--linha);padding:14px;}
    .rail-label{display:none;}
    .rail-item{flex:none;width:auto;white-space:nowrap;}
    .rail-item-text small{display:none;}
    .stage{padding:28px 12px;}
  }
</style>
<script>
  if (window !== window.top) {
    document.documentElement.classList.add('embedded');
  }
</script>
</head>

const rail = document.getElementById('rail');
screens.forEach((s,i)=>{
  if(s.branch && !screens[i-1].branch){
    const divider = document.createElement('div');
    divider.className = 'rail-label';
    divider.style.marginTop = '14px';
    divider.style.paddingTop = '14px';
    divider.style.borderTop = '1px solid var(--linha)';
    divider.textContent = 'Caminho alternativo: exige projeto elétrico';
    rail.appendChild(divider);
  }
  const b = document.createElement('button');
  b.className='rail-item';
  b.onclick=()=>go(i);
  const marker = i===0 ? '●' : (s.branch ? '🔧' : i);
  b.innerHTML = `<span class="rail-num">${marker}</span>
    <span class="rail-item-text"><b>${s.nav}</b><small>${s.code}</small></span>`;
  rail.appendChild(b);
});

function selectCard(el){
  const siblings = el.parentElement.querySelectorAll('.card');
  siblings.forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
}
function signNow(el){
  el.textContent = "✓ Assinado com sucesso";
  el.classList.add('done');
}

function go(i){
  const s = screens[i];
  if(!s) return;
  document.querySelectorAll('.rail-item').forEach((el,idx)=>el.classList.toggle('active', idx===i));

  let headerHtml = '';
  if(s.header !== false){
    headerHtml = `
      <div class="app-header">
        <div class="stepline">
          <span class="back">‹</span>
          <span class="count">${s.count||''}</span>
        </div>
        <div class="track"><div class="track-fill" style="width:${s.progress||0}%"></div></div>
        <h2>${s.title||''}</h2>
        <p>${s.sub||''}</p>
      </div>`;
  }

  const phoneBody = document.getElementById('phoneBody');
  phoneBody.style.opacity = 0;
  setTimeout(()=>{
    phoneBody.innerHTML = `
      ${headerHtml}
      <div class="app-content">${s.content}</div>
      <div class="app-footer">${s.footer}</div>
    `;
    phoneBody.style.opacity = 1;
    window.parent.postMessage({ type: 'LIGACAO_NOVA_STEP', step: i, title: s.nav }, '*');
  }, 90);

  const sp = s.spec;
  if(sp) {
    let rulesHtml = '';
    if(sp.rules && sp.rules.length){
      rulesHtml = `<div class="spec-block"><h3>Regras de negócio aplicadas</h3><ul class="rn-list">
        ${sp.rules.map(r=>`<li><b>${r[0]}</b>${r[1]}</li>`).join('')}
      </ul></div>`;
    }
    let quoteHtml = sp.quote ? `<div class="spec-block"><h3>Pergunta ao cliente</h3><p class="quote">“${sp.quote}”</p></div>` : '';
    let bpHtml = sp.bp ? `<div class="spec-block"><h3>Boa prática de mercado incorporada</h3><div class="bp"><span class="tag">Benchmark</span><br>${sp.bp}</div></div>` : '';

    document.getElementById('specPanel').innerHTML = `
      <span class="spec-code">${s.code}</span>
      <h2>${s.nav}</h2>
      <p class="obj">${sp.obj}</p>
      ${quoteHtml}
      ${rulesHtml}
      ${bpHtml}
    `;
  }
}

// Lógica de GPS Mock
function getLocation(btn) {
  selectCard(btn);
  document.getElementById('map-frame').style.display = 'flex';
  document.getElementById('gps-status').innerText = 'Buscando satélites...';
  setTimeout(() => {
    document.getElementById('map-text').innerText = 'Localização encontrada: Colatina-ES';
    document.getElementById('gps-status').innerText = 'Localização confirmada ✓';
    document.getElementById('gps-status').style.color = 'var(--verde)';
  }, 1500);
}

// Comunicação com a Mari
window.addEventListener('message', (event) => {
  const data = event.data;
  if (data && data.action === 'go') {
    go(data.step);
  } else if (data && data.action === 'fill') {
    const el = document.getElementById(data.fieldId);
    if (el) el.value = data.value;
  }
});

document.getElementById('phoneBody').style.transition = 'opacity .12s ease';
go(0);
</script>
